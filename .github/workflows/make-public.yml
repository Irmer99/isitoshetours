name: Make GHCR packages public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: List and set container packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          headers = {
            "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "ishe-make-public",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(url, method="GET", body=None):
            req = urllib.request.Request(url, method=method, headers=headers)
            data = json.dumps(body).encode() if body else None
            try:
              with urllib.request.urlopen(req, data) as resp:
                return resp.status, json.loads(resp.read().decode())
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode() or "{}")

          discovered = []
          for url in [
            "https://api.github.com/user/packages?package_type=container",
            "https://api.github.com/users/irmer99/packages?package_type=container",
          ]:
            code, data = call(url)
            if code == 200:
              for p in data:
                discovered.append((p.get("name"), p.get("visibility"), p.get("html_url")))
            else:
              print(f"[list] HTTP {code}: {data.get('message')}")

          if not discovered:
            print("ERROR: no container packages discovered")
            raise SystemExit(1)

          for name, vis, url in discovered:
            print(f"- name={name!r} visibility={vis} url={url}")
            encoded = urllib.parse.quote(name, safe="")
            target = f"https://api.github.com/user/packages/container/{encoded}/visibility"
            code, data = call(target, method="POST", body={"visibility": "public"})
            print(f"  -> set public: HTTP {code}: {data.get('message', 'ok')}")
          EOF