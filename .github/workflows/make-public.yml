name: Make GHCR packages public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  make-public:
    runs-on: ubuntu-latest
    steps:
      - name: Try candidate names and endpoints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request, urllib.error

          headers = {
            "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "ishe-make-public",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(url, method="GET", body=None):
            req = urllib.request.Request(url, method=method, headers=headers)
            data = json.dumps(body).encode() if body else None
            try:
              with urllib.request.urlopen(req, data) as resp:
                return resp.status, json.loads(resp.read().decode())
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode() or "{}")

          images = ["isitoshetours-backend", "isitoshetours-frontend"]
          owners = ["irmer99/isitoshetours-backend", "irmer99/isitoshetours-frontend"]
          base_urls = ["https://api.github.com/user/packages/container",
                       "https://api.github.com/users/irmer99/packages/container"]

          # First try to fetch each package to learn its canonical name.
          for url in base_urls:
            for cand in images + owners:
              enc = urllib.parse.quote(cand, safe="")
              code, data = call(f"{url}/{enc}")
              if code == 200:
                print(f"GET ok: name={data.get('name')!r} visibility={data.get('visibility')!r} via {url}")
              else:
                print(f"GET {code}: {cand} via {url}")

          print("--- set visibility public ---")
          ok = False
          for url in base_urls:
            for cand in images + owners:
              enc = urllib.parse.quote(cand, safe="")
              target = f"{url}/{enc}/visibility"
              code, data = call(target, method="POST", body={"visibility": "public"})
              if code in (204, 200):
                print(f"SUCCESS: {cand} via {url}: HTTP {code}")
                ok = True
              else:
                print(f"POST {code}: {cand} via {url}: {data.get('message','?')}")
          if not ok:
            raise SystemExit(1)
          EOF