name: Publish Docker images

on:
  push:
    branches: [main]

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/irmer99/isitoshetours

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./ishe_backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ishe_frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, subprocess, urllib.parse, urllib.request

          headers = {
            "Authorization": f"Bearer {__import__('os').environ['GH_TOKEN']}",
            "Accept": "application/vnd.github+json",
            "User-Agent": "ishe-publish",
            "X-GitHub-Api-Version": "2022-11-28",
          }

          def call(url, method="GET", body=None):
            req = urllib.request.Request(url, method=method, headers=headers)
            data = json.dumps(body).encode() if body else None
            try:
              with urllib.request.urlopen(req, data) as resp:
                return resp.status, json.loads(resp.read().decode())
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode() or "{}")

          names = []
          for scope, url in [
            ("user", "https://api.github.com/user/packages?package_type=container"),
            ("users", f"https://api.github.com/users/irmer99/packages?package_type=container"),
          ]:
            code, data = call(url)
            if code == 200:
              for p in data:
                names.append((scope, p.get("name"), p.get("visibility"), p.get("html_url")))
            else:
              print(f"[list {scope}] HTTP {code}: {data.get('message')}")

          if not names:
            print("WARN: no container packages discovered")
            raise SystemExit(0)

          for scope, name, vis, url in names:
            print(f"- package name={name!r} visibility={vis} url={url}")

          for scope, name, vis, url in names:
            encoded = urllib.parse.quote(name, safe="")
            endpoint = "user" if scope == "user" else "users/irmer99"
            target = f"https://api.github.com/{endpoint}/packages/container/{encoded}/visibility"
            code, data = call(target, method="POST", body={"visibility": "public"})
            print(f"  -> set {name} public: HTTP {code}: {data.get('message', 'ok')}")
          EOF