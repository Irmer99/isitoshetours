services:
  - type: web
    name: ishe-backend
    runtime: docker
    dockerfilePath: ./ishe_backend/Dockerfile
    dockerContext: ./ishe_backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 14d
      - key: CORS_ORIGIN
        value: https://isitoshetours-1.onrender.com,https://isitoshetours.com
      - key: FRONTEND_URL
        value: https://isitoshetours.com
      - key: ADMIN_EMAIL
        value: admin@isitoshetours.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ROLE
        value: superadmin
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        value: "Isitoshe Tours <onboarding@resend.dev>"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: images
    healthCheckPath: /health
    autoDeploy: false

  - type: web
    name: ishe-frontend
    runtime: docker
    dockerfilePath: ./ishe_frontend/Dockerfile
    dockerContext: ./ishe_frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: SSR_API_URL
        value: https://isitoshetours.onrender.com/api
    autoDeploy: false
